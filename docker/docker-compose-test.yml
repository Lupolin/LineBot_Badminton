services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16687:16686" # Jaeger UI
      - "4319:4318"   # OTLP HTTP 接收點
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=TestDB
    ports:
      - "5433:5432"
    volumes:
      - ../migration/sqlcmd/db_init.sql:/docker-entrypoint-initdb.d/init_all.sql
